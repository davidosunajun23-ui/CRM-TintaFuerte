<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Cotizador - Tinta Fuerte</title>
    
    <!-- Tailwind CSS para el diseño responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Versión 8 compatible para usar en un solo archivo sin módulos) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // 1. CONFIGURACIÓN DE FIREBASE (Reemplaza con tus datos reales)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const { useState, useEffect } = React;

        // 2. COMPONENTE PRINCIPAL
        function App() {
            const [vistaActual, setVistaActual] = useState('leads'); // 'leads', 'detalle', 'reportes'
            const [leadSeleccionado, setLeadSeleccionado] = useState(null);
            
            return (
                <div class="min-h-screen flex flex-col">
                    {/* Barra de Navegación */}
                    <nav class="bg-gray-900 text-white p-4 shadow-md">
                        <div class="max-w-6xl mx-auto flex justify-between items-center">
                            <h1 class="text-xl font-bold tracking-wider">TINTA FUERTE <span class="font-light text-gray-400">| CRM</span></h1>
                            <div class="flex space-x-4">
                                <button 
                                    onClick={() => setVistaActual('leads')} 
                                    class={`px-3 py-1 rounded ${vistaActual === 'leads' ? 'bg-blue-600' : 'hover:bg-gray-700'}`}>
                                    Leads
                                </button>
                                <button 
                                    onClick={() => setVistaActual('reportes')} 
                                    class={`px-3 py-1 rounded ${vistaActual === 'reportes' ? 'bg-blue-600' : 'hover:bg-gray-700'}`}>
                                    Tablero
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* Contenedor Principal */}
                    <main class="flex-1 w-full max-w-6xl mx-auto p-4">
                        {vistaActual === 'leads' && <VistaLeads alSeleccionarLead={(lead) => { setLeadSeleccionado(lead); setVistaActual('detalle'); }} />}
                        {vistaActual === 'detalle' && leadSeleccionado && <VistaDetalleLead leadId={leadSeleccionado.id} volver={() => setVistaActual('leads')} />}
                        {vistaActual === 'reportes' && <VistaReportes />}
                    </main>
                </div>
            );
        }

        // 3. VISTA: LISTA DE LEADS Y REGISTRO RÁPIDO
        function VistaLeads({ alSeleccionarLead }) {
            const [leads, setLeads] = useState([]);
            const [mostrarModal, setMostrarModal] = useState(false);

            useEffect(() => {
                const unsubscribe = db.collection("leads").orderBy("fechaCreacion", "desc").onSnapshot(snapshot => {
                    setLeads(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => unsubscribe();
            }, []);

            return (
                <div>
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-gray-700">Oportunidades</h2>
                        <button onClick={() => setMostrarModal(true)} class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 font-bold">
                            + Registrar Lead
                        </button>
                    </div>

                    <div class="bg-white rounded-lg shadow overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 text-gray-600 text-sm uppercase">
                                    <th class="p-4 border-b">Fecha</th>
                                    <th class="p-4 border-b">Cliente</th>
                                    <th class="p-4 border-b">Canal</th>
                                    <th class="p-4 border-b">Servicio</th>
                                    <th class="p-4 border-b">Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                {leads.map(lead => (
                                    <tr key={lead.id} onClick={() => alSeleccionarLead(lead)} class="hover:bg-gray-50 cursor-pointer border-b last:border-0 transition">
                                        <td class="p-4">{new Date(lead.fechaCreacion?.toDate()).toLocaleDateString()}</td>
                                        <td class="p-4 font-semibold">{lead.nombre} <br/><span class="text-xs text-gray-400 font-normal">{lead.telefono}</span></td>
                                        <td class="p-4 text-sm">{lead.canal}</td>
                                        <td class="p-4 text-sm">{lead.servicio}</td>
                                        <td class="p-4">
                                            <span class="px-2 py-1 text-xs font-bold rounded-full bg-blue-100 text-blue-800">
                                                {lead.etapa || 'Nuevo'}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                                {leads.length === 0 && <tr><td colSpan="5" class="p-8 text-center text-gray-400">No hay leads registrados.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    {mostrarModal && <ModalRegistroLead cerrar={() => setMostrarModal(false)} />}
                </div>
            );
        }

        // 4. MODAL: REGISTRO DE LEAD (En menos de 1 minuto)
        function ModalRegistroLead({ cerrar }) {
            const guardarLead = async (e) => {
                e.preventDefault();
                const form = e.target;
                const nuevoLead = {
                    nombre: form.nombre.value,
                    telefono: form.telefono.value,
                    canal: form.canal.value,
                    servicio: form.servicio.value,
                    prenda: form.prenda.value,
                    etapa: 'Lead Nuevo',
                    fechaCreacion: firebase.firestore.FieldValue.serverTimestamp(),
                    cotizacionActiva: null
                };
                await db.collection("leads").add(nuevoLead);
                cerrar();
            };

            return (
                <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                    <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
                        <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-lg">
                            <h3 class="font-bold text-lg">Nuevo Lead</h3>
                            <button onClick={cerrar} class="text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
                        </div>
                        <form onSubmit={guardarLead} class="p-4 space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-1">Nombre del Cliente</label>
                                <input type="text" name="nombre" required class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none"/>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-1">Teléfono (WhatsApp)</label>
                                <input type="tel" name="telefono" required class="w-full border rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none"/>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">Canal de Llegada</label>
                                    <select name="canal" class="w-full border rounded p-2 bg-white outline-none">
                                        <option value="WhatsApp Directo">WhatsApp Directo</option>
                                        <option value="Anuncio Facebook">Anuncio Facebook</option>
                                        <option value="Instagram Direct">Instagram Direct</option>
                                        <option value="Visita Tienda">Visita Tienda</option>
                                        <option value="Mercado Libre">Mercado Libre</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-600 mb-1">Servicio Solicitado</label>
                                    <select name="servicio" class="w-full border rounded p-2 bg-white outline-none">
                                        <option value="Impresión DTF">Impresión DTF</option>
                                        <option value="Impresión DTG">Impresión DTG</option>
                                        <option value="Bordado">Bordado</option>
                                        <option value="Blank/Mayoreo">Prendas Lisas</option>
                                    </select>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-1">Prenda / Detalle</label>
                                <select name="prenda" class="w-full border rounded p-2 bg-white outline-none">
                                    <option value="Playera Oversize (Ej. Shaka/Wusstek)">Playera Oversize</option>
                                    <option value="Gorra Snapback/Trucker (Ej. Yupoong)">Gorra</option>
                                    <option value="Hoodie">Hoodie / Sudadera</option>
                                    <option value="Solo Impresión (Trae Prenda)">Solo Impresión (Cliente trae prenda)</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 transition">
                                Guardar Lead Rápido
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // 5. VISTA: DETALLE DEL LEAD (Cotizaciones, Seguimientos, Pedidos)
        function VistaDetalleLead({ leadId, volver }) {
            const [lead, setLead] = useState(null);
            
            useEffect(() => {
                const unsubscribe = db.collection("leads").doc(leadId).onSnapshot(doc => {
                    if(doc.exists) setLead({ id: doc.id, ...doc.data() });
                });
                return () => unsubscribe();
            }, [leadId]);

            if (!lead) return <div class="p-8 text-center">Cargando...</div>;

            return (
                <div class="space-y-6">
                    <button onClick={volver} class="text-blue-600 hover:underline"><i class="fas fa-arrow-left mr-2"></i>Volver al listado</button>
                    
                    <div class="bg-white p-6 rounded-lg shadow">
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-3xl font-bold text-gray-800">{lead.nombre}</h2>
                                <p class="text-gray-500"><i class="fab fa-whatsapp mr-1 text-green-500"></i> {lead.telefono} | Llegó por: {lead.canal}</p>
                                <p class="mt-2 text-sm text-gray-700 bg-gray-100 p-2 rounded inline-block">Interés: {lead.servicio} - {lead.prenda}</p>
                            </div>
                            <span class="px-4 py-2 rounded font-bold text-sm bg-yellow-100 text-yellow-800 uppercase tracking-wide">
                                Etapa: {lead.etapa}
                            </span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Columna Izquierda: Seguimientos */}
                        <SeccionSeguimientos leadId={leadId} />

                        {/* Columna Derecha: Cotización Activa */}
                        <SeccionCotizacion lead={lead} />
                    </div>
                </div>
            );
        }

        // 6. COMPONENTE: SECCIÓN DE COTIZACIÓN (Maneja la lógica rápida -> formal y soft delete)
        function SeccionCotizacion({ lead }) {
            const [editando, setEditando] = useState(false);
            const [montoInput, setMontoInput] = useState('');
            const [tipoInput, setTipoInput] = useState('');

            const guardarCotizacion = async (e) => {
                e.preventDefault();
                const esNueva = !lead.cotizacionActiva;
                const nuevoMonto = parseFloat(montoInput);
                
                let dataActualizada = {};

                if (esNueva) {
                    dataActualizada = {
                        cotizacionActiva: {
                            tipo: tipoInput, // 'Rápida' o 'Formal'
                            monto: nuevoMonto,
                            ruta: tipoInput === 'Formal' ? 'Directa' : 'Normal',
                            fechaRapida: tipoInput === 'Rápida' ? new Date().toISOString() : null,
                            fechaFormal: tipoInput === 'Formal' ? new Date().toISOString() : null,
                            estado: 'activa'
                        },
                        etapa: tipoInput === 'Formal' ? 'Cotización Formal' : 'Cotización Rápida'
                    };
                } else {
                    // Actualización o paso a formal
                    const c = lead.cotizacionActiva;
                    const escalaAFormal = c.tipo === 'Rápida' && tipoInput === 'Formal';
                    
                    dataActualizada = {
                        cotizacionActiva: {
                            ...c,
                            tipo: tipoInput,
                            monto: nuevoMonto,
                            historialMontoRapido: escalaAFormal ? c.monto : (c.historialMontoRapido || null),
                            fechaFormal: escalaAFormal ? new Date().toISOString() : c.fechaFormal,
                            ruta: escalaAFormal ? 'Escalada' : c.ruta
                        },
                        etapa: tipoInput === 'Formal' ? 'Cotización Formal' : 'Cotización Rápida'
                    };
                }

                await db.collection("leads").doc(lead.id).update(dataActualizada);
                setEditando(false);
            };

            const anularCotizacion = async () => {
                if(confirm("¿Seguro que deseas anular esta cotización? (Soft delete)")){
                    await db.collection("leads").doc(lead.id).update({
                        'cotizacionActiva.estado': 'anulada_por_error',
                        etapa: 'Lead Nuevo'
                    });
                }
            };

            const cot = lead.cotizacionActiva;

            return (
                <div class="bg-white rounded-lg shadow p-6 border-t-4 border-blue-500">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold text-gray-700">Cotización y Pedido</h3>
                        {!cot || cot.estado === 'anulada_por_error' ? (
                            <button onClick={() => {setTipoInput('Rápida'); setMontoInput(''); setEditando(true);}} class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded font-bold hover:bg-blue-200">
                                + Crear Cotización
                            </button>
                        ) : null}
                    </div>

                    {editando ? (
                        <form onSubmit={guardarCotizacion} class="space-y-4 bg-gray-50 p-4 rounded border">
                            <div>
                                <label class="block text-xs font-bold text-gray-600">Tipo</label>
                                <select value={tipoInput} onChange={e=>setTipoInput(e.target.value)} class="w-full p-2 border rounded">
                                    <option value="Rápida">Cotización Rápida</option>
                                    <option value="Formal">Cotización Formal</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-600">Monto Total Estimado ($)</label>
                                <input type="number" step="0.01" value={montoInput} onChange={e=>setMontoInput(e.target.value)} required class="w-full p-2 border rounded" />
                            </div>
                            <div class="flex space-x-2">
                                <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded text-sm font-bold w-full">Guardar</button>
                                <button type="button" onClick={()=>setEditando(false)} class="bg-gray-300 text-gray-800 px-4 py-2 rounded text-sm font-bold">Cancelar</button>
                            </div>
                        </form>
                    ) : (
                        cot && cot.estado !== 'anulada_por_error' ? (
                            <div class="bg-blue-50 rounded p-4 border border-blue-100">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <span class={`text-xs font-bold px-2 py-1 rounded ${cot.tipo === 'Formal' ? 'bg-purple-200 text-purple-800' : 'bg-yellow-200 text-yellow-800'}`}>
                                            {cot.tipo.toUpperCase()}
                                        </span>
                                        <p class="text-3xl font-bold mt-2">${parseFloat(cot.monto).toLocaleString('es-MX')}</p>
                                        {cot.historialMontoRapido && (
                                            <p class="text-xs text-gray-500 line-through">Ant. ${parseFloat(cot.historialMontoRapido).toLocaleString('es-MX')}</p>
                                        )}
                                        <p class="text-xs text-gray-500 mt-2">
                                            Ruta: {cot.ruta} <br/>
                                            {cot.fechaRapida && `Rápida: ${new Date(cot.fechaRapida).toLocaleDateString()}`} <br/>
                                            {cot.fechaFormal && `Formal: ${new Date(cot.fechaFormal).toLocaleDateString()}`}
                                        </p>
                                    </div>
                                    <div class="space-x-2">
                                        <button onClick={() => { setTipoInput(cot.tipo); setMontoInput(cot.monto); setEditando(true); }} class="text-gray-400 hover:text-blue-600"><i class="fas fa-pencil-alt"></i></button>
                                        <button onClick={anularCotizacion} class="text-gray-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <p class="text-sm text-gray-500 text-center p-4 border-2 border-dashed rounded">No hay cotización activa.</p>
                        )
                    )}
                </div>
            );
        }

        // 7. COMPONENTE: SEGUIMIENTOS (Edición y creación rápida)
        function SeccionSeguimientos({ leadId }) {
            const [seguimientos, setSeguimientos] = useState([]);
            const [texto, setTexto] = useState('');
            const [respondio, setRespondio] = useState('Pendiente');

            useEffect(() => {
                const unsubscribe = db.collection("leads").doc(leadId).collection("seguimientos")
                    .orderBy("fecha", "desc").onSnapshot(snapshot => {
                        setSeguimientos(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    });
                return () => unsubscribe();
            }, [leadId]);

            const agregarSeguimiento = async (e) => {
                e.preventDefault();
                await db.collection("leads").doc(leadId).collection("seguimientos").add({
                    fecha: firebase.firestore.FieldValue.serverTimestamp(),
                    nota: texto,
                    respondio: respondio,
                    intento: seguimientos.length + 1
                });
                setTexto('');
            };

            return (
                <div class="bg-white rounded-lg shadow p-6 border-t-4 border-green-500">
                    <h3 class="text-xl font-bold text-gray-700 mb-4">Bitácora de Recontacto</h3>
                    
                    <form onSubmit={agregarSeguimiento} class="mb-6 flex gap-2">
                        <select value={respondio} onChange={e=>setRespondio(e.target.value)} class="border rounded p-2 text-sm bg-gray-50">
                            <option>Pendiente</option>
                            <option>Sí respondió</option>
                            <option>No respondió</option>
                        </select>
                        <input type="text" placeholder="Nota rápida..." value={texto} onChange={e=>setTexto(e.target.value)} required class="border rounded p-2 text-sm flex-1" />
                        <button type="submit" class="bg-green-500 text-white px-3 rounded hover:bg-green-600"><i class="fas fa-plus"></i></button>
                    </form>

                    <div class="space-y-3 max-h-64 overflow-y-auto">
                        {seguimientos.map(seg => (
                            <div key={seg.id} class="border-l-2 border-gray-200 pl-3 py-1">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold text-gray-500">Intento #{seg.intento} • {seg.fecha ? new Date(seg.fecha.toDate()).toLocaleDateString() : 'Hoy'}</span>
                                    <span class={`text-[10px] px-2 py-0.5 rounded-full font-bold ${seg.respondio === 'Sí respondió' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>{seg.respondio}</span>
                                </div>
                                <p class="text-sm text-gray-700 mt-1">{seg.nota}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // 8. VISTA: TABLERO / REPORTES SIMPLIFICADO
        function VistaReportes() {
            // Este componente calcularía métricas basadas en los documentos de Firebase.
            // Para la versión HTML de copia directa, mostramos una estructura visual limpia de lo que contendrá.
            return (
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold text-gray-700">Tablero de Ventas</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-white p-6 rounded shadow border-l-4 border-blue-500">
                            <p class="text-sm text-gray-500 font-bold uppercase">Leads Activos</p>
                            <p class="text-3xl font-black mt-2 text-blue-600">Calculando...</p>
                        </div>
                        <div class="bg-white p-6 rounded shadow border-l-4 border-purple-500">
                            <p class="text-sm text-gray-500 font-bold uppercase">Cotizaciones Formales</p>
                            <p class="text-3xl font-black mt-2 text-purple-600">Calculando...</p>
                        </div>
                        <div class="bg-white p-6 rounded shadow border-l-4 border-green-500">
                            <p class="text-sm text-gray-500 font-bold uppercase">Dinero Cobrado</p>
                            <p class="text-3xl font-black mt-2 text-green-600">Calculando...</p>
                        </div>
                    </div>
                    
                    <div class="bg-white p-8 rounded shadow text-center text-gray-500">
                        <i class="fas fa-chart-line text-4xl mb-3 text-gray-300"></i>
                        <p>Los reportes se generan automáticamente a partir de los registros ingresados en la base de datos Firestore de Tinta Fuerte.</p>
                    </div>
                </div>
            );
        }

        // Renderizar la App en el DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
